<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messenger - Вход</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-box">
            <div class="auth-header">
                <div class="logo">
                    <i class="fas fa-comments"></i>
                    <h1>Messenger</h1>
                </div>
                <p class="subtitle">Общайтесь с близкими</p>
            </div>

            <!-- Login Form -->
            <div id="loginForm" class="auth-form active">
                <h2>Вход</h2>
                <div class="input-group">
                    <i class="fas fa-user"></i>
                    <input type="text" id="loginEmail" placeholder="Email или username" required>
                </div>
                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="loginPassword" placeholder="Пароль" required>
                    <i class="fas fa-eye toggle-password"></i>
                </div>
                <button class="btn btn-primary" id="loginBtn">
                    <span>Войти</span>
                    <i class="fas fa-arrow-right"></i>
                </button>
                <p class="switch-form">
                    Нет аккаунта? <a href="#" id="showRegister">Зарегистрироваться</a>
                </p>
            </div>

            <!-- Register Form -->
            <div id="registerForm" class="auth-form">
                <h2>Регистрация</h2>

                <!-- Step 1: Email -->
                <div class="register-step active" data-step="1">
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="registerEmail" placeholder="Email" required>
                    </div>
                    <button class="btn btn-primary" id="sendCodeBtn">
                        <span>Получить код</span>
                        <i class="fas fa-paper-plane"></i>
                    </button>
                </div>

                <!-- Step 2: Verification Code -->
                <div class="register-step" data-step="2">
                    <p class="info-text">
                        <i class="fas fa-info-circle"></i>
                        Введите код из письма, отправленного на <span id="emailDisplay"></span>
                    </p>
                    <div class="code-inputs">
                        <input type="text" maxlength="1" class="code-input" data-index="0">
                        <input type="text" maxlength="1" class="code-input" data-index="1">
                        <input type="text" maxlength="1" class="code-input" data-index="2">
                        <input type="text" maxlength="1" class="code-input" data-index="3">
                        <input type="text" maxlength="1" class="code-input" data-index="4">
                        <input type="text" maxlength="1" class="code-input" data-index="5">
                    </div>
                    <button class="btn btn-secondary" id="resendCodeBtn">
                        <i class="fas fa-redo"></i>
                        Отправить код повторно
                    </button>
                    <button class="btn btn-primary" id="verifyCodeBtn">
                        <span>Подтвердить</span>
                        <i class="fas fa-check"></i>
                    </button>
                </div>

                <!-- Step 3: Create Account -->
                <div class="register-step" data-step="3">
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" id="registerUsername" placeholder="Имя пользователя" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="registerPassword" placeholder="Пароль" required>
                        <i class="fas fa-eye toggle-password"></i>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="registerPasswordConfirm" placeholder="Подтвердите пароль" required>
                        <i class="fas fa-eye toggle-password"></i>
                    </div>
                    <button class="btn btn-primary" id="completeRegisterBtn">
                        <span>Создать аккаунт</span>
                        <i class="fas fa-user-plus"></i>
                    </button>
                </div>

                <p class="switch-form">
                    Уже есть аккаунт? <a href="#" id="showLogin">Войти</a>
                </p>
            </div>

            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>
        </div>

        <div class="particles">
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
            <div class="particle"></div>
        </div>
    </div>

    <script src="auth.js"></script>
</body>
</html>
